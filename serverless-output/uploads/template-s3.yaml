AWSTemplateFormatVersion: '2010-09-09'
Description: >
  S3 bucket para uploads del monolito migrado a serverless.
  Generado por Skill 04 — Upload Migrator.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Ambiente de despliegue

Resources:
  # ====================================================================
  # S3 Bucket — Almacenamiento de archivos subidos por usuarios
  # ====================================================================
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'taller-uploads-0ae08399-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
- 'https://localhost:3000'
          - 'https://tu-app.com'
            AllowedMethods:
              - PUT
              - POST
            AllowedHeaders:
              - '*'
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersionsAfter90Days
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
          - Id: AbortIncompleteMultipartUpload
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ====================================================================
  # Bucket Policy — Denegar acceso público explícitamente
  # ====================================================================
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub '${UploadBucket.Arn}/*'
              - !GetAtt UploadBucket.Arn
            Condition:
              Bool:
                'aws:SecureTransport': false

Outputs:
  BucketName:
    Description: Nombre del S3 bucket
    Value: !Ref UploadBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  BucketArn:
    Description: ARN del S3 bucket
    Value: !GetAtt UploadBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  BucketDomainName:
    Description: Domain name del bucket
    Value: !GetAtt UploadBucket.RegionalDomainName
    Export:
      Name: !Sub '${AWS::StackName}-BucketDomainName'